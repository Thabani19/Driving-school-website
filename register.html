<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account | TK Driving School</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; font-family: 'Inter', Arial, sans-serif;
            background: linear-gradient(135deg, #0b1c3d, #1e3a6d);
        }
        .frame { width: 100%; min-height: 100vh; display: flex; }
        .brand {
            width: 50%; background: linear-gradient(135deg, #0b1c3d, #1e3a6d);
            color: white; display: flex; flex-direction: column; justify-content: center;
            align-items: center; text-align: center; padding: 40px;
        }
        .brand h2 { font-family: 'Oswald', sans-serif; font-size: 64px; letter-spacing: 2px; margin: 0 0 15px; line-height: 1.1; }
        .brand p { font-size: 18px; color: #d1d5db; font-style: italic; }
        .form-panel {
            width: 50%; background: #f3f4f6; display: flex; flex-direction: column;
            justify-content: center; padding: 60px;
        }
        .form-head { margin-bottom: 30px; }
        .form-head h1 { font-family: 'Oswald', sans-serif; font-size: 46px; margin: 0 0 10px; color: #0f172a; }
        .form-head p { color: #6b7280; margin: 0; }
        .form-head a { color: #b91c1c; text-decoration: none; font-weight: 600; }
        .field { margin-bottom: 18px; }
        .field label { display: block; margin-bottom: 8px; font-weight: 600; color: #0f172a; }
        .field input { width: 100%; padding: 13px 14px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 15px; background: white; }
        .field input:focus { border-color: #b91c1c; outline: none; }
        .pw-wrap { position: relative; }
        .pw-wrap input { padding-right: 80px; }
        .pw-toggle {
            position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
            border: none; background: none; color: #b91c1c; font-weight: 700; cursor: pointer;
        }
        .submit {
            width: 100%; padding: 14px; border: none; border-radius: 6px; background: #0b1c3d;
            color: white; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 8px;
        }
        .submit:hover { background: #142a56; }
        .message {
            display: none; padding: 12px 14px; border-radius: 6px; margin-bottom: 18px; font-size: 14px;
        }
        .message.error { display: block; background: #fee2e2; color: #991b1b; }
        .message.success { display: block; background: #dcfce7; color: #166534; }
        @media (max-width: 768px) {
            .frame { flex-direction: column; }
            .brand, .form-panel { width: 100%; }
            .brand { min-height: 250px; }
            .brand h2 { font-size: 36px; }
            .form-panel { padding: 35px 25px; }
        }
    </style>
</head>
<body>
    <div class="frame">
        <div class="brand">
            <h2>TK DRIVING SCHOOL</h2>
            <p>Learn to drive with confidence.</p>
        </div>

        <div class="form-panel">
            <div class="form-head">
                <h1>Create account</h1>
                <p>Already have an account? <a href="login.html">Sign in</a></p>
            </div>

            <div id="registerMessage" class="message"></div>

            <form id="registerForm">
                <div class="field">
                    <label for="firstName">First name</label>
                    <input id="firstName" type="text" required />
                </div>

                <div class="field">
                    <label for="lastName">Last name</label>
                    <input id="lastName" type="text" required />
                </div>

                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" type="email" required />
                </div>

                <div class="field">
                    <label for="phone">Phone number</label>
                    <input id="phone" type="tel" required />
                </div>

                <div class="field">
                    <label for="dateOfBirth">Date of birth</label>
                    <input id="dateOfBirth" type="date" required />
                </div>

                <div class="field">
                    <label for="address">Address</label>
                    <input id="address" type="text" required />
                </div>

                <div class="field">
                    <label for="city">City</label>
                    <input id="city" type="text" required />
                </div>

                <div class="field">
                    <label for="postcode">Postcode</label>
                    <input id="postcode" type="text" required />
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <div class="pw-wrap">
                        <input id="password" type="password" required />
                        <button type="button" class="pw-toggle" onclick="const i=document.getElementById('password'); i.type = i.type === 'password' ? 'text' : 'password'; this.textContent = i.type === 'password' ? 'SHOW' : 'HIDE';">SHOW</button>
                    </div>
                </div>

                <div class="field">
                    <label for="confirmPassword">Confirm password</label>
                    <div class="pw-wrap">
                        <input id="confirmPassword" type="password" required />
                        <button type="button" class="pw-toggle" onclick="const i=document.getElementById('confirmPassword'); i.type = i.type === 'password' ? 'text' : 'password'; this.textContent = i.type === 'password' ? 'SHOW' : 'HIDE';">SHOW</button>
                    </div>
                </div>

                <button type="submit" class="submit">Create account</button>
            </form>
        </div>
    </div>

    <script src="Scripts/auth.js"></script>
</body>
</html>
