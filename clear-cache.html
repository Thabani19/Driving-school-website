<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clear Cache & Start Fresh</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Inter', Arial, sans-serif;
            background: linear-gradient(135deg, #0b1c3d, #1e3a6d);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            background: white;
            border-radius: 10px;
            padding: 40px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            color: #0f172a;
            margin-bottom: 20px;
        }

        p {
            color: #6b7280;
            font-size: 16px;
            margin-bottom: 30px;
        }

        .status {
            background: #dcfce7;
            color: #166534;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .btn {
            padding: 14px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #0b1c3d;
            color: white;
        }

        .btn-primary:hover {
            background: #142a56;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #e5e7eb;
            border-top-color: #0b1c3d;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧹 Clear All Data</h1>
        <p>This will completely clear your browser storage and session data.</p>
        
        <div id="status" class="status" style="display: none;">
            <span class="spinner"></span>
            Clearing...
        </div>

        <div id="completed" style="display: none;">
            <div class="status">✅ All data cleared! Ready to start fresh.</div>
            <p>You will be redirected to the login page in 2 seconds...</p>
        </div>

        <div id="buttons">
            <button class="btn btn-primary" onclick="clearEverything()">Clear & Start Fresh</button>
        </div>
    </div>

    <script>
        function clearEverything() {
            document.getElementById('status').style.display = 'block';
            document.getElementById('buttons').style.display = 'none';

            // Clear everything
            setTimeout(function() {
                localStorage.clear();
                sessionStorage.clear();
                
                // Also clear specific keys
                localStorage.removeItem('currentUser');
                localStorage.removeItem('users');
                localStorage.removeItem('rememberMe');
                sessionStorage.removeItem('currentUser');
                
                // Delete all cookies
                document.cookie.split(";").forEach(function(c) { 
                    document.cookie = c.replace(/^ +/, "")
                        .replace(/=.*/, "=;expires=" + new Date().toUTCString() + ";path=/"); 
                });

                document.getElementById('status').style.display = 'none';
                document.getElementById('completed').style.display = 'block';

                setTimeout(function() {
                    window.location.href = 'login.html';
                }, 2000);
            }, 500);
        }

        // Auto-run on page load if clicked
        window.addEventListener('load', function() {
            console.log('Cache clear page loaded. Click the button to start fresh.');
        });
    </script>
</body>
</html>
